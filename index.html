
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Lato:wght@300;400;700&family=Pacifico&family=Press+Start+2P&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',sans-serif;background:#f5f5f5;min-height:100vh}
.hdr{text-align:center;padding:18px 16px 12px;border-bottom:1px solid rgba(0,0,0,.08);background:#fff}
.hdr h1{font-family:'Playfair Display',serif;font-size:24px;color:#333;letter-spacing:1px}
.hdr p{font-size:10px;color:#aaa;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
.steps{display:flex;justify-content:center;align-items:center;gap:4px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee}
.stp{display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#ccc}
.stp.active{color:#555}.stp.done{color:#888}
.snum{width:20px;height:20px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.stp.active .snum{background:#333;color:#fff}.stp.done .snum{background:#888;color:#fff}
.ssep{color:#ddd;font-size:12px}
.content{max-width:900px;margin:0 auto;padding:20px 14px}
.sec-title{font-family:'Playfair Display',serif;font-size:18px;color:#333;margin-bottom:16px;text-align:center}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.tcard{border:2.5px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.07);transition:all .2s}

.tlabel{padding:6px 5px;text-align:center;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#555;border-top:1px solid #f0f0f0;line-height:1.3}

.btn-p:hover{background:#111}.btn-p:disabled{background:#ccc;cursor:not-allowed}

.cam-wrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.cam-side{flex:1;min-width:240px}.prev-side{flex:1;min-width:200px}
.vwrap{position:relative;background:#111;border-radius:10px;overflow:hidden;aspect-ratio:4/3}
#vid{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cdov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:80px;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.8);pointer-events:none;opacity:0;transition:opacity .2s}
.cam-btns{display:flex;gap:8px;margin-top:10px}
.slots{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.slot{background:#f5f2ed;border:1.5px dashed #ccc;border-radius:7px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;font-size:12px;color:#bbb}
.slot img{width:100%;height:100%;object-fit:cover}
.slabel{position:absolute;top:5px;left:7px;background:rgba(0,0,0,.5);color:#fff;font-size:9px;padding:2px 5px;border-radius:3px;font-weight:700}
.rbtn{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:4px;font-size:9px;padding:2px 7px;cursor:pointer;font-weight:700}
.rbtn:hover{background:rgba(0,0,0,.8)}
.sinfo{font-size:12px;color:#555;font-weight:700;margin-bottom:8px;text-align:center}

@media(max-width:600px){
  #btnTo2-wrap{position:fixed;bottom:0;left:0;right:0;padding:12px 16px 20px;background:linear-gradient(transparent,rgba(245,245,245,.98) 30%);z-index:100}
  #btnTo2{width:100%;padding:14px}
  #p1{padding-bottom:80px}
  .content{padding:12px 10px}
  .cam-wrap{flex-direction:column;gap:10px}
  .cam-side,.prev-side{width:100%;min-width:0;flex:none}
  .vwrap{aspect-ratio:4/3;max-height:52vw}
  .prev-side{display:flex;flex-direction:column;gap:6px}
  .slots{flex-direction:row;gap:8px;margin-bottom:0}
  .slot{flex:1;aspect-ratio:3/4}
  .sinfo{font-size:11px;margin-bottom:0}
  #btnTo3{margin-top:4px;padding:13px}
  .cam-btns{gap:6px}
  .cam-btns .btn-p{font-size:11px;padding:10px 14px}
  .cam-btns .btn-s{font-size:11px;padding:10px 12px}
}
.res-wrap{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.ccontainer{flex:1;min-width:240px;display:flex;justify-content:center}
#finalCanvas{max-width:100%;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.rctrl{flex:1;min-width:190px;display:flex;flex-direction:column;gap:11px;padding-top:6px}
.rctrl h3{font-family:'Playfair Display',serif;font-size:20px;color:#222}
.rctrl p{font-size:13px;color:#888;line-height:1.6}
.btn-dl{padding:13px 22px;background:#333;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;width:100%;transition:all .2s}
.btn-dl:hover{background:#111;transform:translateY(-1px)}
.btn-rs{padding:11px 22px;background:#fff;color:#333;border:1.5px solid #333;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;width:100%}
.btn-rs:hover{background:#f5f5f5}
.page{display:none}.page.show{display:block}
</style>

<script>
// ── HELPERS ──────────────────────────────────────────────────────────
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}
function star(ctx,cx,cy,r,c){
  ctx.save();ctx.fillStyle=c;ctx.beginPath();
  for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2;const ri=i%2===0?r:r*.45;ctx.lineTo(cx+Math.cos(a)*ri,cy+Math.sin(a)*ri);}
  ctx.closePath();ctx.fill();ctx.restore();
}
function heart(ctx,x,y,s,c){
  ctx.save();ctx.fillStyle=c;ctx.beginPath();
  ctx.moveTo(x,y+s*.3);ctx.bezierCurveTo(x,y,x-s,y,x-s,y+s*.3);
  ctx.bezierCurveTo(x-s,y+s*.65,x,y+s*.9,x,y+s);
  ctx.bezierCurveTo(x,y+s*.9,x+s,y+s*.65,x+s,y+s*.3);
  ctx.bezierCurveTo(x+s,y,x,y,x,y+s*.3);ctx.closePath();ctx.fill();ctx.restore();
}
function loadPhotos(photos,cb){
  const imgs=[];let n=0;
  photos.forEach((url,i)=>{const img=new Image();img.onload=()=>{imgs[i]=img;if(++n===photos.length)cb(imgs);};img.src=url;});
}
function placePhotos(ctx,imgs,margin,photoW,photoH,gap){
  imgs.forEach((img,i)=>{
    const x=margin,y=margin+i*(photoH+gap);
    ctx.save();rr(ctx,x,y,photoW,photoH,5);ctx.clip();
    const sc=Math.max(photoW/img.width,photoH/img.height);
    ctx.drawImage(img,x+(photoW-img.width*sc)/2,y+(photoH-img.height*sc)/2,img.width*sc,img.height*sc);
    ctx.restore();
  });
}
function miniSlots(ctx,W,fill,stroke){
  const m=12,ph=58,pw=W-m*2,gap=5;
  for(let i=0;i<2;i++){
    const y=m+i*(ph+gap);
    ctx.fillStyle=fill;rr(ctx,m,y,pw,ph,4);ctx.fill();
    ctx.strokeStyle=stroke;ctx.lineWidth=1;rr(ctx,m,y,pw,ph,4);ctx.stroke();
    ctx.fillStyle=stroke+'99';ctx.font='15px serif';ctx.textAlign='center';
    ctx.fillText('📷',W/2,y+ph/2+6);
  }
}

// ── TEMPLATES ────────────────────────────────────────────────────────
const W0=140,H0=195;
const TPLS=[

// 1. CUTE CLOUDS
{id:'clouds',name:'Cute Clouds ☁️',
mini(ctx){
  ctx.fillStyle='#e8f4fd';ctx.fillRect(0,0,W0,H0);
  // clouds
  function cloud(x,y,s){ctx.fillStyle='rgba(255,255,255,0.85)';[[-s*.6,0],[0,-s*.4],[s*.6,0],[0,s*.3]].forEach(([dx,dy])=>{ctx.beginPath();ctx.arc(x+dx,y+dy,s*.55,0,Math.PI*2);ctx.fill();});}
  cloud(20,22,14);cloud(W0-20,22,12);cloud(18,H0-42,10);cloud(W0-18,H0-42,11);
  ctx.strokeStyle='#7ec8e3';ctx.lineWidth=2;ctx.strokeRect(4,4,W0-8,H0-8);
  miniSlots(ctx,W0,'#d0ecf9','#7ec8e3');
  ctx.fillStyle='#3a7ca5';ctx.font='bold 7px sans-serif';ctx.textAlign='center';ctx.letterSpacing='1px';
  ctx.fillText('HEAD IN THE CLOUDS',W0/2,H0-30);
  ctx.font='10px serif';ctx.fillStyle='#5ba3cc';ctx.letterSpacing='0px';
  ctx.fillText('☁️ dream big ☁️',W0/2,H0-17);
},
final(ctx,W,H,photos,done){
  const m=22,pw=W-m*2,ph=Math.round(pw*.72),g=10;
  ctx.fillStyle='#e8f4fd';ctx.fillRect(0,0,W,H);
  // big clouds bg
  function cloud(x,y,s){ctx.fillStyle='rgba(255,255,255,0.7)';[[-s*.6,0],[0,-s*.4],[s*.6,0],[0,s*.3]].forEach(([dx,dy])=>{ctx.beginPath();ctx.arc(x+dx,y+dy,s*.55,0,Math.PI*2);ctx.fill();});}
  cloud(40,40,30);cloud(W-40,40,26);cloud(30,H-70,22);cloud(W-30,H-70,24);
  ctx.strokeStyle='#7ec8e3';ctx.lineWidth=3;ctx.strokeRect(5,5,W-10,H-10);
  loadPhotos(photos,imgs=>{
    placePhotos(ctx,imgs,m,pw,ph,g);
    imgs.forEach((_,i)=>{ctx.strokeStyle='#7ec8e3';ctx.lineWidth=2;rr(ctx,m,m+i*(ph+g),pw,ph,5);ctx.stroke();});
    const fy=m+2*(ph+g)-g+14;
    ctx.textAlign='center';
    ctx.fillStyle='#3a7ca5';ctx.font='bold 13px Lato,sans-serif';ctx.letterSpacing='2px';
    ctx.fillText('HEAD IN THE CLOUDS',W/2,fy+20);
    ctx.letterSpacing='0px';ctx.font='16px serif';ctx.fillStyle='#5ba3cc';
    ctx.fillText('☁️ dream big ☁️',W/2,fy+44);
    done();
  });
}},

// 2. PIXEL / 8-BIT
{id:'pixel',name:'8-Bit Pixel 👾',
mini(ctx){
  ctx.fillStyle='#0f0f23';ctx.fillRect(0,0,W0,H0);
  // pixel border
  ctx.fillStyle='#00ff41';
  for(let i=0;i<W0;i+=6){ctx.fillRect(i,0,4,4);ctx.fillRect(i,H0-4,4,4);}
  for(let i=0;i<H0;i+=6){ctx.fillRect(0,i,4,4);ctx.fillRect(W0-4,i,4,4);}
  miniSlots(ctx,W0,'#1a1a3a','#00ff41');
  ctx.fillStyle='#00ff41';ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.letterSpacing='2px';
  ctx.fillText('PIXEL PERFECT',W0/2,H0-30);
  ctx.fillStyle='#ff00ff';ctx.font='7px monospace';ctx.letterSpacing='0px';
  ctx.fillText('INSERT COIN',W0/2,H0-18);
},
final(ctx,W,H,photos,done){
  const m=22,pw=W-m*2,ph=Math.round(pw*.72),g=10;
  ctx.fillStyle='#0f0f23';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#00ff41';
  for(let i=0;i<W;i+=10){ctx.fillRect(i,0,7,7);ctx.fillRect(i,H-7,7,7);}
  for(let i=0;i<H;i+=10){ctx.fillRect(0,i,7,7);ctx.fillRect(W-7,i,7,7);}
  loadPhotos(photos,imgs=>{
    placePhotos(ctx,imgs,m,pw,ph,g);
    imgs.forEach((_,i)=>{ctx.strokeStyle='#00ff41';ctx.lineWidth=2;rr(ctx,m,m+i*(ph+g),pw,ph,2);ctx.stroke();});
    const fy=m+2*(ph+g)-g+14;
    ctx.textAlign='center';
    ctx.fillStyle='#00ff41';ctx.font='bold 14px monospace';ctx.letterSpacing='3px';
    ctx.fillText('PIXEL PERFECT',W/2,fy+22);
    ctx.fillStyle='#ff00ff';ctx.font='11px monospace';ctx.letterSpacing='2px';
    ctx.fillText('★ INSERT COIN ★',W/2,fy+44);
    done();
  });
}},

// 3. RAINBOW DOODLE
{id:'doodle',name:'Rainbow Doodle 🌈',
mini(ctx){
  ctx.fillStyle='#fffef0';ctx.fillRect(0,0,W0,H0);
  const cols=['#ff6b6b','#ffa500','#ffe066','#6bcb77','#4d9de0','#9b59b6'];
  ctx.lineWidth=2;
  cols.forEach((c,i)=>{
    ctx.strokeStyle=c;ctx.beginPath();
    ctx.moveTo(0,4+i*2);ctx.lineTo(W0,4+i*2);ctx.stroke();
    ctx.moveTo(0,H0-4-i*2);ctx.lineTo(W0,H0-4-i*2);ctx.stroke();
  });
  miniSlots(ctx,W0,'#fffce8','#ffb347');
  ctx.fillStyle='#e74c3c';ctx.font='bold 7px sans-serif';ctx.textAlign='center';ctx.letterSpacing='1px';
  ctx.fillText('DOODLE LAND',W0/2,H0-30);
  ctx.fillStyle='#9b59b6';ctx.font='9px serif';ctx.letterSpacing='0px';
  ctx.fillText('🌈 be colorful 🌈',W0/2,H0-17);
},
final(ctx,W,H,photos,done){
  const m=22,pw=W-m*2,ph=Math.round(pw*.72),g=10;
  ctx.fillStyle='#fffef0';ctx.fillRect(0,0,W,H);
  const cols=['#ff6b6b','#ffa500','#ffe066','#6bcb77','#4d9de0','#9b59b6'];
  ctx.lineWidth=3;
  cols.forEach((c,i)=>{
    ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(0,6+i*3);ctx.lineTo(W,6+i*3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,H-6-i*3);ctx.lineTo(W,H-6-i*3);ctx.stroke();
  });
  loadPhotos(photos,imgs=>{
    placePhotos(ctx,imgs,m,pw,ph,g);
    imgs.forEach((_,i)=>{ctx.strokeStyle='#ffb347';ctx.lineWidth=2.5;rr(ctx,m,m+i*(ph+g),pw,ph,5);ctx.stroke();});
    const fy=m+2*(ph+g)-g+14;
    ctx.textAlign='center';
    ctx.fillStyle='#e74c3c';ctx.font='bold 16px Lato,sans-serif';ctx.letterSpacing='2px';
    ctx.fillText('DOODLE LAND',W/2,fy+22);
    ctx.letterSpacing='0px';ctx.font='18px serif';ctx.fillStyle='#9b59b6';
    ctx.fillText('🌈 be colorful 🌈',W/2,fy+46);
    done();
  });
}},

// 4. KAWAII PINK
{id:'kawaii',name:'Kawaii Pink 🎀',
mini(ctx){
  ctx.fillStyle='#fff0f5';ctx.fillRect(0,0,W0,H0);
  // bow top center
  function bow(x,y,s){
    ctx.fillStyle='#ff85a1';
    ctx.beginPath();ctx.ellipse(x-s,y,s*.9,s*.5,-.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+s,y,s*.9,s*.5,.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x,y,s*.3,0,Math.PI*2);ctx.fill();
  }
  bow(W0/2,14,10);bow(20,H0-20,7);bow(W0-20,H0-20,7);
  ctx.strokeStyle='#ffadc5';ctx.lineWidth=1.5;ctx.strokeRect(5,5,W0-10,H0-10);
  // hearts
  heart(ctx,14,45,.06*W0,'rgba(255,133,161,0.4)');
  heart(ctx,W0-20,45,.06*W0,'rgba(255,133,161,0.4)');
  miniSlots(ctx,W0,'#ffe8ef','#ffadc5');
  ctx.fillStyle='#d63a6e';ctx.font='bold 7px sans-serif';ctx.textAlign='center';ctx.letterSpacing='1px';
  ctx.fillText('KAWAII BOOTH',W0/2,H0-30);
  ctx.font='9px serif';ctx.fillStyle='#ff85a1';ctx.letterSpacing='0px';
  ctx.fillText('♡ so cute ♡',W0/2,H0-17);
},
final(ctx,W,H,photos,done){
  const m=22,pw=W-m*2,ph=Math.round(pw*.72),g=10;
  ctx.fillStyle='#fff0f5';ctx.fillRect(0,0,W,H);
  function bow(x,y,s){
    ctx.fillStyle='#ff85a1';
    ctx.beginPath();ctx.ellipse(x-s,y,s*.9,s*.5,-.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+s,y,s*.9,s*.5,.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x,y,s*.3,0,Math.PI*2);ctx.fill();
  }
  bow(W/2,18,22);bow(35,H-32,14);bow(W-35,H-32,14);
  heart(ctx,30,60,.06*W,'rgba(255,133,161,0.35)');heart(ctx,W-45,60,.06*W,'rgba(255,133,161,0.35)');
  ctx.strokeStyle='#ffadc5';ctx.lineWidth=2.5;ctx.strokeRect(5,5,W-10,H-10);
  loadPhotos(photos,imgs=>{
    placePhotos(ctx,imgs,m,pw,ph,g);
    imgs.forEach((_,i)=>{ctx.strokeStyle='#ffadc5';ctx.lineWidth=2;rr(ctx,m,m+i*(ph+g),pw,ph,5);ctx.stroke();});
    const fy=m+2*(ph+g)-g+14;
    ctx.textAlign='center';
    ctx.fillStyle='#d63a6e';ctx.font='bold 14px Lato,sans-serif';ctx.letterSpacing='2px';
    ctx.fillText('KAWAII BOOTH',W/2,fy+20);
    ctx.letterSpacing='0px';ctx.font='20px serif';ctx.fillStyle='#ff85a1';
    ctx.fillText('♡ so cute ♡',W/2,fy+46);
    done();
  });
}},

// 5. STARRY NIGHT
{id:'starry',name:'Starry Night ⭐',
mini(ctx){
  ctx.fillStyle='#0a0a2e';ctx.fillRect(0,0,W0,H0);
  // stars
  const stars2=[[15,12,3,'#ffe566'],[W0-15,15,2.5,'#fff'],[W0/2,8,3,'#ff9ecd'],[10,H0-25,2,'#7ec8e3'],[W0-10,H0-28,2.5,'#ffe566'],[W0/2-20,H0-15,2,'#fff'],[W0/2+20,H0-18,2,'#ff9ecd']];
  stars2.forEach(([x,y,r,c])=>{star(ctx,x,y,r,c);});
  ctx.strokeStyle='#4a4a8a';ctx.lineWidth=1.5;ctx.strokeRect(5,5,W0-10,H0-10);
  miniSlots(ctx,W0,'#12124a','#4a4a8a');

// ── STATE ─────────────────────────────────────────────────────────────
let selTpl=null,photos=[null,null],curSlot=0,camStream=null,shooting=false;

// ── RENDER GRID ───────────────────────────────────────────────────────
function renderGrid(){
  const g=document.getElementById('tgrid');g.innerHTML='';
  TPLS.forEach(tpl=>{
    const card=document.createElement('div');card.className='tcard';
    const cv=document.createElement('canvas');cv.width=W0;cv.height=H0;cv.style.cssText='display:block;width:100%;height:auto';
    const lbl=document.createElement('div');lbl.className='tlabel';lbl.textContent=tpl.name;
    card.appendChild(cv);card.appendChild(lbl);
    card.addEventListener('click',()=>{
      selTpl=tpl;photos=[null,null];curSlot=0;
      document.querySelectorAll('.tcard').forEach(c=>c.classList.remove('sel'));
      card.classList.add('sel');document.getElementById('btnTo2').disabled=false;
    });
    g.appendChild(card);
    setTimeout(()=>tpl.mini(cv.getContext('2d')),0);
  });
}

// ── NAV ───────────────────────────────────────────────────────────────
function showPage(n){
  ['p1','p2','p3'].forEach((id,i)=>document.getElementById(id).classList.toggle('show',i+1===n));
  ['si1','si2','si3'].forEach((id,i)=>{const el=document.getElementById(id);el.classList.remove('active','done');if(i+1===n)el.classList.add('active');else if(i+1<n)el.classList.add('done');});
}

// ── CAMERA ────────────────────────────────────────────────────────────
async function startCam(){
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});document.getElementById('vid').srcObject=camStream;}
  catch(e){alert('Kamera tidak bisa diakses.\n'+e.message);}
}
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}document.getElementById('vid').srcObject=null;}

function initSlots(){
  const w=document.getElementById('slotsWrap');w.innerHTML='';
  for(let i=0;i<2;i++){const d=document.createElement('div');d.className='slot';d.id='slot'+i;d.innerHTML=`<span style="color:#bbb;font-size:12px">Foto ${i+1}</span>`;w.appendChild(d);}
  updateInfo();
}
function updateInfo(){
  const taken=photos.filter(Boolean).length;
  const info=document.getElementById('sinfo');
  if(taken===2){info.textContent='✓ Semua foto sudah diambil!';document.getElementById('btnTo3').disabled=false;}
  else{info.textContent=`Foto ${taken+1} dari 2`;document.getElementById('btnTo3').disabled=true;}
  curSlot=photos.findIndex(p=>!p);
}
function doCapture(){
  if(shooting||curSlot<0||curSlot>=2)return;
  shooting=true;document.getElementById('btnCapture').disabled=true;
  const ov=document.getElementById('cdov');let n=3;ov.textContent=n;ov.style.opacity=1;
  const iv=setInterval(()=>{n--;if(n>0){ov.textContent=n;}else{clearInterval(iv);ov.style.opacity=0;snap();shooting=false;document.getElementById('btnCapture').disabled=false;}},900);
}
function snap(){
  const vid=document.getElementById('vid');
  const c=document.createElement('canvas');c.width=vid.videoWidth||640;c.height=vid.videoHeight||480;
  const ctx=c.getContext('2d');ctx.save();ctx.scale(-1,1);ctx.drawImage(vid,-c.width,0);ctx.restore();
  const url=c.toDataURL('image/jpeg',.92);photos[curSlot]=url;
  const s=document.getElementById('slot'+curSlot);
  s.innerHTML=`<img src="${url}" alt="foto ${curSlot+1}"><span class="slabel">Foto ${curSlot+1}</span><button class="rbtn" data-i="${curSlot}">↺ Ulang</button>`;
  s.querySelector('.rbtn').addEventListener('click',e=>{e.stopPropagation();const idx=+e.target.dataset.i;photos[idx]=null;document.getElementById('slot'+idx).innerHTML=`<span style="color:#bbb;font-size:12px">Foto ${idx+1}</span>`;updateInfo();});
  updateInfo();
}

// ── FINAL ─────────────────────────────────────────────────────────────
function buildFinal(){
  const canvas=document.getElementById('finalCanvas');
  const tpl=selTpl;
  const W=600,m=22,pw=W-m*2,ph=Math.round(pw*.72),g=10,fh=140;
  const H=m+2*(ph+g)-g+fh;
  canvas.width=W;canvas.height=H;
  tpl.final(canvas.getContext('2d'),W,H,photos,()=>{});
}

// ── EVENTS ────────────────────────────────────────────────────────────
document.getElementById('btnTo2').addEventListener('click',()=>{photos=[null,null];curSlot=0;showPage(2);initSlots();startCam();});
document.getElementById('btnBack1').addEventListener('click',()=>{stopCam();showPage(1);});
document.getElementById('btnCapture').addEventListener('click',doCapture);
document.getElementById('btnTo3').addEventListener('click',()=>{stopCam();showPage(3);setTimeout(buildFinal,80);});
document.getElementById('btnDl').addEventListener('click',()=>{const a=document.createElement('a');a.download=`photobooth_${selTpl.id}_${Date.now()}.jpg`;a.href=document.getElementById('finalCanvas').toDataURL('image/jpeg',.95);a.click();});
document.getElementById('btnRestart').addEventListener('click',()=>{selTpl=null;photos=[null,null];curSlot=0;document.getElementById('btnTo2').disabled=true;document.querySelectorAll('.tcard').forEach(c=>c.classList.remove('sel'));showPage(1);});

renderGrid();showPage(1);
</script>
